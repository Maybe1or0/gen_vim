name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static validation and audit
        run: npm run ci

  extension-test:
    name: VS Code ${{ matrix.vscode-version }}
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode-version:
          - stable
          - 1.85.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Extension Host smoke test
        run: xvfb-run -a npm test
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}

  package:
    name: Package VSIX
    needs:
      - static-checks
      - extension-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        run: |
          mkdir -p dist
          npm run package -- --out dist/genvim.vsix

      - name: List packaged files
        run: npx --no-install vsce ls

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: genvim-vsix
          path: dist/genvim.vsix
          if-no-files-found: error
          retention-days: 14
